        const { useState, useEffect, useRef, useCallback } = React;

        // ===================== FADEIN COMPONENT =====================
        const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = '', as: Component = 'div' }) => {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: '50px', amount: 0 });

            return (
                <motion.div
                    ref={ref}
                    initial={{ opacity: 0, x, y }}
                    animate={isInView ? { opacity: 1, x: 0, y: 0 } : { opacity: 0, x, y }}
                    transition={{
                        duration,
                        delay,
                        ease: [0.25, 0.1, 0.25, 1],
                    }}
                    className={className}
                >
                    {children}
                </motion.div>
            );
        };

        // ===================== MAGNET COMPONENT =====================
        const Magnet = ({ children, padding = 150, strength = 3, activeTransition = 'transform 0.3s ease-out', inactiveTransition = 'transform 0.6s ease-in-out' }) => {
            const ref = useRef(null);
            const [transform, setTransform] = useState({ x: 0, y: 0 });
            const [isActive, setIsActive] = useState(false);

            const handleMouseMove = useCallback((e) => {
                if (!ref.current) return;
                const rect = ref.current.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const distX = e.clientX - centerX;
                const distY = e.clientY - centerY;
                const distance = Math.sqrt(distX * distX + distY * distY);
                const maxDist = Math.max(rect.width, rect.height) / 2 + padding;

                if (distance < maxDist) {
                    setIsActive(true);
                    setTransform({
                        x: distX / strength,
                        y: distY / strength,
                    });
                } else {
                    setIsActive(false);
                    setTransform({ x: 0, y: 0 });
                }
            }, [padding, strength]);

            const handleMouseLeave = useCallback(() => {
                setIsActive(false);
                setTransform({ x: 0, y: 0 });
            }, []);

            useEffect(() => {
                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, [handleMouseMove]);

            return (
                <div
                    ref={ref}
                    onMouseLeave={handleMouseLeave}
                    style={{
                        transform: `translate3d(${transform.x}px, ${transform.y}px, 0)`,
                        transition: isActive ? activeTransition : inactiveTransition,
                        willChange: 'transform',
                    }}
                >
                    {children}
                </div>
            );
        };

                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4 sm:mb-6">

                            <div className="w-[60%] rounded-[40px] sm:rounded-[50px] md:rounded-[60px] overflow-hidden">
                                <img src={project.col2Img} alt="" className="w-full h-full object-cover" loading="lazy" />
                            </div>
                        </div>
                    </motion.div>

        const ProjectsSection = () => {

                    <div className="max-w-6xl mx-auto">

        // ===================== FOOTER =====================
